name: Validate server-hosted update feed
on:
  push:
    paths: ['updates/stable.json', 'tools/publish_update_manifest.py']
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Validate metadata for server-hosted compiled downloads
        run: python3 tools/publish_update_manifest.py --validate-only
